# Gathers The Wire: headlines from the sources in news/feeds.json, every hour.
# It commits news/news.json only when there are new headlines.
name: Gather the wire

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wire
  cancel-in-progress: false

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read the sources
        run: node scripts/fetch-news.mjs
      - name: Save new headlines
        run: |
          if git diff --quiet -- news/news.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add news/news.json
          git commit -q -m "Update the wire"
          for i in 1 2 3; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
