      <path d="M23 7L47-5V72L23 84Z" fill="#132d3b" stroke="#3d606c" stroke-width=".8"/>
      <path d="M0 0L23 7V84L0 77Z" fill="#071822" stroke="#557782" stroke-width=".8"/>
