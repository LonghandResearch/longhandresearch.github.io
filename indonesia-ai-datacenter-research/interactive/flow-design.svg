      <path d="M-22-11L22 11M-22 11L22-11M0-24V24" stroke="#93adaa" stroke-opacity=".28" stroke-width=".8"/>
    </g>
  </defs>
  <style>
    .idn-flow-design{display:block;width:100%;height:auto;background:#091924;color:#edf2ea;font-family:Arial,Helvetica,sans-serif}
    .idn-flow-design text{font-family:Arial,Helvetica,sans-serif}
    .idn-flow-design .f-label{font-size:13px;font-weight:600;letter-spacing:1.6px;fill:#b3c9cc}
    .idn-flow-design .f-caption{font-size:15px;fill:#a5bfc2}
    .idn-flow-design .f-path-label{font-size:14px;fill:#c3d4d2}
    .idn-flow-design .f-card-label{font-size:12px;font-weight:600;letter-spacing:1.3px;fill:#b5c9cb}
    .idn-flow-design .f-value{font-size:26px;letter-spacing:-.4px;font-weight:500;fill:#edd5a8}
    .idn-flow-design #flow-water{font-size:21px;letter-spacing:-.25px;font-weight:500;fill:#a9ddd0}
    .idn-flow-design .f-footnote{font-size:12.5px;fill:#adc2c3}
    .idn-flow-design .f-power{fill:none;stroke:#d3ab6a;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
    .idn-flow-design .f-water{fill:none;stroke:#77c7b9;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .idn-flow-design .f-energy-trace{fill:none;stroke:#f3d79d;stroke-width:1.2;stroke-dasharray:4 24;animation:f-energy 12s linear infinite;opacity:.8}
    .idn-flow-design .f-water-trace{fill:none;stroke:#c0efe2;stroke-width:1;stroke-dasharray:3 20;animation:f-water 15s linear infinite;opacity:.8}
    .idn-flow-design .f-circulation{fill:none;stroke:#70b7b1;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    @keyframes f-energy{to{stroke-dashoffset:-224}}
    @keyframes f-water{to{stroke-dashoffset:-184}}
    @media(prefers-reduced-motion:reduce){.idn-flow-design .f-energy-trace,.idn-flow-design .f-water-trace{animation:none;stroke-dasharray:none;opacity:.35}}
  </style>

