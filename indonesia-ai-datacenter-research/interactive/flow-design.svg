<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="idn-flow-design" role="img" aria-label="An isometric data center with grid electricity entering from a substation, recirculating cooling on the right and local make-up water below" aria-describedby="flow-description" focusable="false">
  <desc id="flow-description">Gold paths show electricity. Teal paths show cooling fluid and make-up water. The three model-linked labels describe IT electricity, facility overhead and direct consumptive cooling water. Recirculating coolant is distinct from water consumption. Intake and returned flows require a site water balance.</desc>
  <defs>
    <radialGradient id="f-backdrop" cx="51%" cy="42%" r="72%">
      <stop stop-color="#193440"/><stop offset=".57" stop-color="#102633"/><stop offset="1" stop-color="#07141f"/>
    </radialGradient>
    <linearGradient id="f-card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#193341"/><stop offset="1" stop-color="#10222e"/>
    </linearGradient>
    <linearGradient id="f-front" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#223c49"/><stop offset="1" stop-color="#0b1d2a"/>
    </linearGradient>
    <linearGradient id="f-side" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#193b46"/><stop offset="1" stop-color="#0b202c"/>
    </linearGradient>
    <linearGradient id="f-glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#79d4cb" stop-opacity=".14"/><stop offset="1" stop-color="#79d4cb" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="f-metal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#587980"/><stop offset="1" stop-color="#243f4b"/>
    </linearGradient>
    <linearGradient id="f-water-tank" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#1b4851"/><stop offset=".45" stop-color="#3b7073"/><stop offset="1" stop-color="#20434e"/>
    </linearGradient>
    <radialGradient id="f-amber-halo">
      <stop stop-color="#d4ad68" stop-opacity=".2"/><stop offset="1" stop-color="#d4ad68" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="f-teal-halo">
      <stop stop-color="#74c8bc" stop-opacity=".2"/><stop offset="1" stop-color="#74c8bc" stop-opacity="0"/>
    </radialGradient>
    <filter id="f-light" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-shadow" x="-35%" y="-35%" width="170%" height="190%">
      <feDropShadow dx="0" dy="11" stdDeviation="12" flood-color="#020b13" flood-opacity=".65"/>
    </filter>
    <marker id="f-power-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#ddba79" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="f-water-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#87d4c6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="f-rack">
