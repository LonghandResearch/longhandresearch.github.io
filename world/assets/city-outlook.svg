<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" shape-rendering="crispEdges" role="img" aria-labelledby="title description">
  <title id="title">The city below Longhand Research</title>
  <desc id="description">A wide view from a high-rise research headquarters at dusk. Nearby glass towers rise above layers of distant buildings and blue atmospheric haze. Tall steel window bays, quiet reflections and warm ceiling light frame the city.</desc>
  <defs>
    <pattern id="smallWindows" width="7" height="8" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="2" height="2" fill="#b9c6c8"/>
      <rect x="5" y="6" width="1" height="1" fill="#d0bb9b"/>
    </pattern>
    <pattern id="amberWindows" width="10" height="9" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="3" height="3" fill="#c4bca2"/>
      <rect x="7" y="6" width="2" height="2" fill="#819ba7"/>
    </pattern>
    <pattern id="glassGrid" width="8" height="11" patternUnits="userSpaceOnUse">
      <rect width="8" height="11" fill="#445e73"/>
      <rect x="1" y="1" width="6" height="8" fill="#708796"/>
      <rect x="1" y="1" width="6" height="2" fill="#a3afb0"/>
      <path d="M0 10H8" stroke="#253e53" stroke-width="1"/>
    </pattern>
    <pattern id="farGrid" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="1" height="1" fill="#aabac1"/>
    </pattern>
    <clipPath id="view"><rect x="76" y="14" width="808" height="202"/></clipPath>
  </defs>
