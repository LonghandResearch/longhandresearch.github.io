<script>
  /* Before the page paints: the theme (saved choice, then the system setting),
     and a flag that scripts are running */
  (function () {
    var d = document.documentElement, t = null;
    d.classList.add('js');
    try { t = localStorage.getItem('longhand-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    d.setAttribute('data-theme', t);
  })();
  window.addEventListener('error', function (e) {
    if (e.filename && /reports\/reports\.js/.test(e.filename)) window.LONGHAND_CATALOG_ERROR = { message: e.message, line: e.lineno };
  });
  /* Page transitions: a step back runs the motion the other way */
  window.addEventListener('pagereveal', function (e) {
    var d = document.documentElement, vt = e.viewTransition, a = window.navigation && navigation.activation;
    delete d.dataset.nav;
    if (!vt) return;
    ['ready', 'finished', 'updateCallbackDone'].forEach(function (k) { if (vt[k]) vt[k].catch(function () {}); });
    window.LONGHAND_VT = vt;
    if (a && a.navigationType === 'traverse' && a.from && a.entry && a.entry.index < a.from.index) d.dataset.nav = 'back';
    var done = function () { delete d.dataset.nav; window.LONGHAND_VT = null; };
    vt.finished.then(done, done);
  });
</script>
